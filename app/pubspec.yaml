name: cataqui_app
description: Cataqui is the real-time opportunity layer of the city.
publish_to: "none"
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  clock: ^1.1.2
  dio: ^5.9.2
  envied: ^1.3.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.0.17
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  maplibre_gl: ^0.26.2
  mateo_mobile: ^0.1.0
  oh_my_flutter: ^0.3.1
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.5
  slang: ^4.16.0
  slang_flutter: ^4.16.0

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.15.0
  dotdart: ^0.6.1
  envied_generator: ^1.3.5
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ">=3.2.5 <3.2.6"
  go_router_builder: ^4.3.0
  integration_test:
    sdk: flutter
  json_serializable: ">=6.13.0 <6.13.1"
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3
  slang_build_runner: ^4.16.0
  test_api: ^0.7.0
  very_good_analysis: ^7.0.0

dotdart:
  output: lib/gen/
  image:
    - assets/three_d/

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    image: true

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/splash/
    - assets/three_d/
