name: cataqui_app
description: Cataqui is the real-time opportunity layer of the city.
publish_to: "none"
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cataqui_core:
    path: ../packages/cataqui_core
  dio: ^5.9.2
  envied: ^1.3.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.0.17
  freezed_annotation: ^3.1.0
  go_router: ^14.0.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  qui:
    path: ../packages/qui
  riverpod_annotation: ^4.0.2
  slang: ^4.16.0
  slang_flutter: ^4.16.0

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.15.0
  envied_generator: ^1.3.5
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  freezed: ">=3.2.5 <3.2.6"
  json_serializable: ">=6.13.0 <6.13.1"
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3
  slang_build_runner: ^4.16.0
  very_good_analysis: ^7.0.0

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    image: true

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
