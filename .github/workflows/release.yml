name: Submit release candidate to App Store

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Cataquí release tag to publish
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: mobile-production
  cancel-in-progress: false

env:
  APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
  BUNDLE_WITHOUT: development
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_HIDE_CHANGELOG: "true"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    name: Submit exact TestFlight candidate
    runs-on: macos-26
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read

    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi

      - name: Verify manually selected release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified_tag="$(
            gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName \
              --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName'
          )"

          if [[ "$verified_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::Release $RELEASE_TAG must be a published stable release."
            exit 1
          fi

      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm 4.1.2
          fvm install

      - name: Resolve workspace
        run: fvm flutter pub get

      - name: Verify release version matches current app version
        run: fvm dart run release:verify_release_version_matches_app "$RELEASE_TAG"

      - name: Verify current code matches approved release candidate
        run: fvm dart run release:verify_current_code_matches_release_candidate

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Submit TestFlight build for App Review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          : "${APP_STORE_CONNECT_API_KEY_ID:?Missing App Store Connect key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing App Store Connect issuer ID}"
          : "${APP_STORE_CONNECT_API_KEY_BASE64:?Missing App Store Connect private key}"
          bundle exec fastlane ios submit_to_app_store
