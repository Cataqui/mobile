name: Contributor agreement

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance recorded
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Verify agreement acceptance
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          if ! jq --exit-status '
            .pull_request.body // ""
            | contains("- [x] I have read and accept the")
          ' "$EVENT_PATH" >/dev/null; then
            echo "::error::Accept the Contributor License Agreement in the pull request checklist."
            exit 1
          fi

          if ! jq --exit-status --raw-output '
            .pull_request.body // ""
            | capture(
                "Legal name or authorized entity representative:\\r?\\n(?:[[:space:]]*\\r?\\n)*(?<name>[^[:space:]<][^\\r\\n]*)"
              )
            | .name
            | select(length > 0)
          ' "$EVENT_PATH" >/dev/null; then
            echo "::error::Add your legal name or authorized entity representative below the agreement."
            exit 1
          fi
