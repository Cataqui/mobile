name: Contributor agreement

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance recorded
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Verify agreement acceptance
        if: ${{ !contains(github.event.pull_request.body, '- [x] I have read and accept the') }}
        run: |
          echo "::error::Accept the Contributor License Agreement in the pull request checklist."
          exit 1

      - name: Confirm agreement acceptance
        run: echo "Contributor License Agreement acceptance is recorded in the pull request."
