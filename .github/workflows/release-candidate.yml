name: Release candidate

on:
  workflow_call:
    inputs:
      branch:
        description: Release Please branch to prepare
        required: true
        type: string
    secrets:
      RELEASE_BOT_PRIVATE_KEY:
        required: true
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_APP_RELEASE_NOTES_AI_GATEWAY_API_TOKEN:
        required: true
      CLOUDFLARE_APP_RELEASE_NOTES_AI_GATEWAY_ID:
        required: true
      APPLE_SIGNING_ENCRYPTION_PASSWORD:
        required: true
      APPLE_SIGNING_REPOSITORY_AUTH:
        required: true

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-candidate-${{ inputs.branch }}
  cancel-in-progress: false

env:
  APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
  BUNDLE_WITHOUT: development
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_HIDE_CHANGELOG: "true"

jobs:
  prepare:
    name: Prepare candidate version and notes
    runs-on: macos-26
    timeout-minutes: 60
    environment: production
    outputs:
      branch: ${{ inputs.branch }}
      commit_hash: ${{ steps.commit.outputs.commit_hash }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out release PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm 4.1.2
          fvm install

      - name: Resolve workspace
        run: fvm flutter pub get

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Read latest TestFlight build
        id: testflight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          : "${APP_STORE_CONNECT_API_KEY_ID:?Missing App Store Connect key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing App Store Connect issuer ID}"
          : "${APP_STORE_CONNECT_API_KEY_BASE64:?Missing App Store Connect private key}"
          bundle exec fastlane ios latest_testflight_build

      - name: Adjust candidate build number
        id: version
        env:
          LATEST_TESTFLIGHT_BUILD: ${{ steps.testflight.outputs.latest_build_number }}
        run: |
          if [[ ! "$LATEST_TESTFLIGHT_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Fastlane did not return a numeric TestFlight build number: ${LATEST_TESTFLIGHT_BUILD}"
            exit 1
          fi

          next_build=$((LATEST_TESTFLIGHT_BUILD + 1))

          version="$(fvm dart run release:adjust_build_number "$next_build")"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then
            echo "::error::Release tooling returned an invalid app version: $version"
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Generate locales
        working-directory: packages/locale
        run: fvm dart run slang

      - name: Generate localized store release notes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_APP_RELEASE_NOTES_AI_GATEWAY_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_RELEASE_NOTES_AI_GATEWAY_API_TOKEN }}
          CLOUDFLARE_APP_RELEASE_NOTES_AI_GATEWAY_ID: ${{ secrets.CLOUDFLARE_APP_RELEASE_NOTES_AI_GATEWAY_ID }}
          APP_RELEASE_NOTES_AI_MODEL: ${{ vars.APP_RELEASE_NOTES_AI_MODEL }}
        run: fvm dart run release:generate_store_release_notes

      - name: Commit prepared candidate
        env:
          CANDIDATE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PR_BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "cataqui-release[bot]"
          git config user.email "cataqui-release[bot]@users.noreply.github.com"
          git add app/pubspec.yaml distribution/releases
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): prepare $CANDIDATE_VERSION candidate"
            git push origin "HEAD:$RELEASE_PR_BRANCH"
          fi

      - name: candidate commPinit hash
        id: commit
        run: |
          commit_hash="$(git rev-parse HEAD)"

          if [[ ! "$commit_hash" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Git returned an invalid candidate commit hash."
            exit 1
          fi

          printf 'commit_hash=%s\n' "$commit_hash" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android candidate
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit_hash }}
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm 4.1.2
          dart pub global activate melos 8.2.2
          fvm install

      - name: Configure app
        run: printf 'ENVIRONMENT=production\n' > .env

      - name: Resolve and generate
        run: |
          fvm flutter pub get
          melos run gen --no-select

      - name: Configure disposable Android release signing
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/cataqui-ci-signing.p12" \
            -storepass cataqui-ci-signing \
            -keypass cataqui-ci-signing \
            -alias cataqui-ci-signing \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storetype PKCS12 \
            -dname "CN=Cataqui CI" \
            -noprompt
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/cataqui-ci-signing.p12" \
            "storePassword=cataqui-ci-signing" \
            "keyAlias=cataqui-ci-signing" \
            "keyPassword=cataqui-ci-signing" \
            > app/android/aab-signing.properties

      - name: Build Android release App Bundle
        working-directory: app
        run: fvm flutter build appbundle --release

      - name: Lint Android release
        working-directory: app/android
        run: ./gradlew :app:lintRelease

  ios:
    name: Internal TestFlight candidate
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit_hash }}
          persist-credentials: false

      - name: Verify release Xcode
        run: xcodebuild -version | grep -E '^Xcode 26\.'

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm 4.1.2
          dart pub global activate melos 8.2.2
          fvm install

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Configure app
        run: printf 'ENVIRONMENT=production\n' > .env

      - name: Resolve and generate
        run: |
          fvm flutter pub get
          melos run gen --no-select

      - name: Build and upload exact pubspec version
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_SIGNING_REPOSITORY_AUTH: ${{ secrets.APPLE_SIGNING_REPOSITORY_AUTH }}
          APPLE_SIGNING_ENCRYPTION_PASSWORD: ${{ secrets.APPLE_SIGNING_ENCRYPTION_PASSWORD }}
          APPLE_SIGNING_GITHUB_REPOSITORY_URL: ${{ vars.APPLE_SIGNING_GITHUB_REPOSITORY_URL }}
        run: |
          : "${APPLE_SIGNING_ENCRYPTION_PASSWORD:?Missing signing encryption password}"
          : "${APPLE_SIGNING_GITHUB_REPOSITORY_URL:?Missing signing repository URL}"
          : "${APPLE_SIGNING_REPOSITORY_AUTH:?Missing signing repository authorization}"

          bundle exec fastlane ios upload_release_candidate_to_testflight

      - name: Upload IPA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cataqui-ios-${{ needs.prepare.outputs.version }}
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 90

  record:
    name: Record Release candidate identity
    needs:
      - prepare
      - android
      - ios
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit_hash }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm 4.1.2
          fvm install

      - name: Resolve workspace
        run: fvm flutter pub get

      - name: Write candidate manifest
        env:
          CANDIDATE_COMMIT_HASH: ${{ needs.prepare.outputs.commit_hash }}
        run: fvm dart run release:write_candidate_manifest.dart

      - name: Commit candidate manifest
        env:
          RELEASE_PR_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          git config user.name "cataqui-release[bot]"
          git config user.email "cataqui-release[bot]@users.noreply.github.com"
          git add distribution/releases
          if git diff --cached --quiet; then
            echo "::notice::The tested candidate manifest is already recorded."
            exit 0
          fi
          git commit -m "chore(release): record tested candidate"
          git push origin "HEAD:$RELEASE_PR_BRANCH"
