dart_husky:
  verbose: true

pre-commit:
  parallel: false
  commands:
    format:
      run: melos format && git add .
    analyze:
      run: melos analyze
      staged_only: true
    test:
      preset: melos
      staged_only: true

commit-msg:
  commands:
    conventional:
      preset: conventional
      types:
        append: [agent, ui]
      only_small_case: false
