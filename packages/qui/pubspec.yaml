name: qui
description: Cataquí UI — reusable design system components for the Cataqui platform.
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  cataqui_core:
    path: ../cataqui_core
  flutter:
    sdk: flutter
  flutter_animate: ^4.0.0
  flutter_svg: ^2.0.17
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  maplibre_gl: ^0.26.1

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.15.0
  flutter_gen_runner: ^5.14.1
  flutter_test:
    sdk: flutter
  freezed: ">=3.2.5 <3.2.6"
  json_serializable: ">=6.13.0 <6.13.1"
  very_good_analysis: ^7.0.0

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    image: true
  assets:
    outputs:
      package_parameter_enabled: true
  fonts:
    outputs:
      package_parameter_enabled: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/three_d/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_variable.ttf
        - asset: assets/fonts/inter_italic.ttf
          style: italic
