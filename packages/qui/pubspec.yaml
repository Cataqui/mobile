name: qui
description: Cataquí UI — reusable design system components for the Cataqui platform.
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  maplibre_gl: ^0.26.2
  oh_my_flutter:
    path: ../oh_my_flutter

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.15.0
  dotdart:
    git:
      url: https://github.com/Cataqui/dotdart.git
      ref: v0.6.0
  flutter_test:
    sdk: flutter
  freezed: ">=3.2.5 <3.2.6"
  json_serializable: ">=6.13.0 <6.13.1"
  test_api: ^0.7.0
  very_good_analysis: ^7.0.0

dotdart:
  output: lib/gen/
  lottie:
    - assets/lotties/
  svg:
    - assets/icons/

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_variable.ttf
        - asset: assets/fonts/inter_italic.ttf
          style: italic
