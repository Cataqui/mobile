name: qui
description: Cataquí UI — reusable design system components for the Cataqui platform.
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  cataqui_core:
    path: ../cataqui_core
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.15.0
  flutter_gen_runner: ^5.14.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter_gen:
  output: lib/gen/
  fonts:
    outputs:
      package_parameter_enabled: true

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_variable.ttf
        - asset: assets/fonts/inter_italic.ttf
          style: italic
