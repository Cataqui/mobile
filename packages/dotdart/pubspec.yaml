name: dotdart
description: Build-time Flutter asset compiler that turns visual assets into dependency-free Dart widget code.
version: 0.1.0
repository: https://github.com/cataqui/mobile
issue_tracker: https://github.com/cataqui/mobile/issues
documentation: https://github.com/cataqui/mobile/tree/main/packages/dotdart
topics:
  - flutter
  - assets
  - codegen
  - lottie
  - svg
  - custom-painter
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  build: ^4.0.0
  dart_style: ^3.0.0
  flutter:
    sdk: flutter
  glob: ^2.1.0
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0
