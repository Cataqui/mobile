name: cataqui_workspce
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - app

dev_dependencies:
  build_runner: ^2.15.0
  dart_husky: ^1.8.1
  melos: 8.2.2
  very_good_analysis: ^7.0.0

# Use the reviewed fork until https://github.com/flutter/packages/pull/12357
# is split, published, and available from pub.dev.
dependency_overrides:
  google_maps_flutter:
    git:
      url: https://github.com/RyanHolanda/packages.git
      ref: dffba8623011b566ed8f0bef77d339e21a4d699c
      path: packages/google_maps_flutter/google_maps_flutter
  google_maps_flutter_android:
    git:
      url: https://github.com/RyanHolanda/packages.git
      ref: dffba8623011b566ed8f0bef77d339e21a4d699c
      path: packages/google_maps_flutter/google_maps_flutter_android
  google_maps_flutter_ios:
    git:
      url: https://github.com/RyanHolanda/packages.git
      ref: dffba8623011b566ed8f0bef77d339e21a4d699c
      path: packages/google_maps_flutter/google_maps_flutter_ios
  google_maps_flutter_ios_sdk9:
    git:
      url: https://github.com/RyanHolanda/packages.git
      ref: dffba8623011b566ed8f0bef77d339e21a4d699c
      path: packages/google_maps_flutter/google_maps_flutter_ios_sdk9
  google_maps_flutter_platform_interface:
    git:
      url: https://github.com/RyanHolanda/packages.git
      ref: dffba8623011b566ed8f0bef77d339e21a4d699c
      path: packages/google_maps_flutter/google_maps_flutter_platform_interface
  google_maps_flutter_web:
    git:
      url: https://github.com/RyanHolanda/packages.git
      ref: dffba8623011b566ed8f0bef77d339e21a4d699c
      path: packages/google_maps_flutter/google_maps_flutter_web

melos:
  name: cataqui

  scripts:
    analyze:
      description: Run static analysis
      run: fvm flutter analyze

    test:
      description: Run tests with coverage
      exec:
        command: |
          fvm flutter test --coverage --test-randomize-ordering-seed=random && \
          if [ -s coverage/lcov.info ]; then \
            remove_from_coverage -f coverage/lcov.info -r '\.g\.dart$' -r '\.freezed\.dart$' && \
            awk '/^name:/ {print $2; exit}' pubspec.yaml | xargs -I {} genhtml coverage/lcov.info \
              --output-directory coverage/html \
              --rc branch_coverage=1 \
              --title "{}" && \
              open coverage/html/index.html; \
          fi
        concurrency: 1
      packageFilters:
        dirExists: test

    test:no-coverage:
      description: Run tests without coverage
      exec:
        command: fvm flutter test --test-randomize-ordering-seed=random
        concurrency: 1
      packageFilters:
        dirExists: test

    coverage:clean:
      description: Remove all coverage artifacts
      run: |
        rm -rf app/coverage/

    coverage:collect:
      description: Run tests with --coverage (no HTML report)
      exec:
        command: |
          fvm flutter test --coverage --test-randomize-ordering-seed=random && \
          if [ -s coverage/lcov.info ]; then \
            remove_from_coverage -f coverage/lcov.info -r '\.g\.dart$' -r '\.freezed\.dart$'; \
          fi
        concurrency: 1
      packageFilters:
        dirExists: test

    goldens:update:
      description: Update approved golden files
      exec:
        command: fvm flutter test --update-goldens --test-randomize-ordering-seed=random
        concurrency: 1
      packageFilters:
        fileExists: dart_test.yaml

    setup:
      description: Set up workspace and activate global packages
      run: |
        fvm install && \
        fvm flutter pub get && \
        fvm dart pub global activate flutter_launcher_icons 0.14.4 && \
        fvm dart pub global activate remove_from_coverage && \
        fvm dart run dart_husky install && \
        melos run gen --no-select && \
        melos run goldens:update --no-select

    get:
      description: Install dependencies for a package
      exec:
        command: fvm flutter pub get
        concurrency: 1

    generate_app_icons:
      description: Run app icon generation
      run: melos exec --scope=cataqui_app -- fvm dart pub global run flutter_launcher_icons

    generate_splash:
      description: Generate native splash screen assets
      run: melos exec --scope=cataqui_app -- fvm dart run vector_graphics_compiler -i assets/splash/animated_splash_icon.svg -o assets/splash/animated_splash_icon.svg.vec && melos exec --scope=cataqui_app -- fvm dart run flutter_native_splash:create

    gen:i18n:
      description: Generate translations and sync native locales
      private: true
      exec:
        command: fvm dart run slang && fvm dart run slang configure
        concurrency: 1
      packageFilters:
        scope: cataqui_app
        dirExists: lib/i18n

    gen:
      description: run build runner and code generations
      steps:
        - gen:i18n
        - gen:code

    gen:code:
      description: Run Dart code generation for selected workspace members
      private: true
      exec:
        command: fvm dart run build_runner build
        concurrency: 1
      packageFilters:
        depends-on: build_runner
