name: cataqui_workspace
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - app
  - packages/cataqui_core
  - packages/qui

dev_dependencies:
  build_runner: ^2.15.0
  melos: ^7.8.0
  very_good_analysis: ^7.0.0

melos:
  name: cataqui

  scripts:
    analyze:
      description: Run static analysis across all packages
      run: fvm flutter analyze

    test:
      description: Run tests across all packages
      run: fvm flutter test
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    get:
      description: Install dependencies for a package
      run: fvm flutter pub get
      exec:
        concurrency: 1

    generate_app_icons:
      description: Run app icon generation
      run: melos exec --scope=app -- fvm dart run flutter_launcher_icons

    codegen:
      description: Run code generation across the workspace
      run: dart run build_runner build --workspace --delete-conflicting-outputs

    codegen:watch:
      description: Watch and regenerate code across the workspace
      run: dart run build_runner watch --workspace --delete-conflicting-outputs
