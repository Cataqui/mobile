name: cataqui_workspace
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - app
  - packages/cataqui_core
  - packages/qui

dev_dependencies:
  build_runner: ^2.15.0
  melos: ^7.8.0
  very_good_analysis: ^7.0.0

melos:
  name: cataqui

  scripts:
    analyze:
      description: Run static analysis across all packages
      run: fvm flutter analyze

    test:
      description: Run tests with coverage, generate HTML report, and open in browser
      run: |
        fvm flutter test --coverage && \
        if [ -s coverage/lcov.info ]; then \
          genhtml coverage/lcov.info \
            --output-directory coverage/html \
            --rc branch_coverage=1 \
            --title "Cataquí — Coverage" && \
          open coverage/html/index.html; \
        fi
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    coverage:
      description: Run tests with coverage, generate HTML, and open (all packages, no prompt)
      run: melos run test --no-select

    coverage:clean:
      description: Remove all coverage artifacts
      run: |
        rm -rf app/coverage/
        rm -rf packages/cataqui_core/coverage/
        rm -rf packages/qui/coverage/

    coverage:collect:
      description: Run tests with --coverage (no HTML report)
      run: fvm flutter test --coverage
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    get:
      description: Install dependencies for a package
      run: fvm flutter pub get
      exec:
        concurrency: 1

    generate_app_icons:
      description: Run app icon generation
      run: melos exec --scope=app -- fvm dart run flutter_launcher_icons

    codegen:
      description: Run code generation across the workspace
      run: dart run build_runner build --workspace --delete-conflicting-outputs

    codegen:watch:
      description: Watch and regenerate code across the workspace
      run: dart run build_runner watch --workspace --delete-conflicting-outputs
