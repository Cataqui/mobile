name: cataqui_workspace
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - app
  - packages/oh_my_flutter
  - packages/qui

dev_dependencies:
  build_runner: ^2.15.0
  dart_husky: ^1.5.0
  melos: ^7.8.0
  very_good_analysis: ^7.0.0

melos:
  name: cataqui

  scripts:
    analyze:
      description: Run static analysis across all packages
      run: fvm flutter analyze

    test:
      description: Run tests with coverage, generate HTML report, and open in browser
      run: |
        fvm flutter test --coverage && \
        if [ -s coverage/lcov.info ]; then \
          remove_from_coverage -f coverage/lcov.info -r '\.g\.dart$' -r '\.freezed\.dart$' && \
          awk '/^name:/ {print $2; exit}' pubspec.yaml | xargs -I {} genhtml coverage/lcov.info \
            --output-directory coverage/html \
            --rc branch_coverage=1 \
            --title "{}" && \
            open coverage/html/index.html; \
        fi
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    test:all:
      description: Run tests with coverage for all packages (no prompt) and open each report
      run: melos run test --no-select

    test:no-coverage:
      description: Run tests without coverage (for pre-commit hook)
      run: fvm flutter test
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    coverage:
      description: Run tests with coverage, generate HTML, and open (all packages, no prompt)
      run: melos run test --no-select

    coverage:clean:
      description: Remove all coverage artifacts
      run: |
        rm -rf app/coverage/
        rm -rf packages/oh_my_flutter/coverage/
        rm -rf packages/qui/coverage/

    coverage:collect:
      description: Run tests with --coverage (no HTML report)
      run: |
        fvm flutter test --coverage && \
        if [ -s coverage/lcov.info ]; then \
          remove_from_coverage -f coverage/lcov.info -r '\.g\.dart$' -r '\.freezed\.dart$'; \
        fi
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    goldens:update:
      description: Update approved golden files (asks which package/app)
      run: fvm flutter test --update-goldens
      exec:
        concurrency: 1
      packageFilters:
        fileExists: dart_test.yaml

    goldens:update:all:
      description: Update approved golden files for all packages/apps (no prompt)
      run: melos run goldens:update --no-select

    setup:
      description: Set up workspace and activate global packages
      run: |
        fvm flutter pub get && \
        fvm dart pub global activate remove_from_coverage && \
        fvm dart run dart_husky install && \
        melos run gen:all && \
        melos run goldens:update:all

    get:
      description: Install dependencies for a package
      run: fvm flutter pub get
      exec:
        concurrency: 1

    dotdart:local:
      description: Resolve dotdart from the sibling checkout for local development
      run: cp pubspec_overrides.yaml.example pubspec_overrides.yaml && fvm flutter pub get

    dotdart:remote-lock:
      description: Regenerate the committed lockfile from the immutable dotdart Git tag
      run: |
        override_file="pubspec_overrides.yaml"
        disabled_file="pubspec_overrides.yaml.disabled"
        if [ -e "$disabled_file" ]; then
          echo "$disabled_file already exists; restore or remove it before continuing."
          exit 1
        fi
        if [ -e "$override_file" ]; then
          mv "$override_file" "$disabled_file"
        fi
        restore_override() {
          if [ -e "$disabled_file" ]; then
            mv "$disabled_file" "$override_file"
          fi
        }
        trap restore_override EXIT
        fvm flutter pub get

    generate_app_icons:
      description: Run app icon generation
      run: melos exec --scope=app -- fvm dart run flutter_launcher_icons

    generate_splash:
      description: Generate native splash screen assets
      run: melos exec --scope=cataqui_app -- fvm dart run vector_graphics_compiler -i assets/splash/animated_splash_icon.svg -o assets/splash/animated_splash_icon.svg.vec && melos exec --scope=cataqui_app -- fvm dart run flutter_native_splash:create

    i18n:configure:
      description: Sync native locale configs (iOS/Android) with translation files
      run: melos exec --scope=app -- fvm dart run slang configure
      packageFilters:
        dirExists: lib/i18n

    gen:all:
      description: Run code generation across the workspace
      run: melos run gen:i18n && fvm dart run build_runner build --workspace

    gen:all:watch:
      description: Watch and regenerate code across the workspace
      run: fvm dart run build_runner watch --workspace

    gen:i18n:
      description: Generate i18n translations (slang)
      run: fvm dart run slang && melos run i18n:configure
      exec:
        concurrency: 1
      packageFilters:
        depends-on: slang_build_runner
        dirExists: lib/i18n

    gen:
      description: Run code generation for selected packages (interactive)
      run: |
        ln -sf ../.env .env 2>/dev/null || true
        fvm dart run build_runner build
      exec:
        concurrency: 1
      packageFilters:
        depends-on: build_runner
